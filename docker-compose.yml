
services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: greenhouse-postgres
    environment:
      POSTGRES_DB: greenhouse_digital_twin
      POSTGRES_USER: greenhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhouse -d greenhouse_digital_twin"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2
    container_name: greenhouse-mosquitto
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

